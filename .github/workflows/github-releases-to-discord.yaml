on:
  release:
    types: [published]

jobs:
  github-releases-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Github Releases To Discord
        uses: SethCohen/github-releases-to-discord@v1.16.2
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "2105893"
          username: "Mission Gaming Release Bot"
          avatar_url: "../../public/vite.svg"
          content: "There is a new version release for https://missiongaming.gg. Check out the release notes below"
          footer_title: "Release Note"
          footer_icon_url: "../../public/vite.svg"
          footer_timestamp: true
          max_description: "4096"
          reduce_headings: true
